name: Continuous Integration
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: bash tests/deploy_smoke.sh
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: docker compose config --quiet
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target test -t sili-bot-test .
      - run: docker run --rm --network none sili-bot-test
      - run: docker build -t sili-bot .
      - name: Validate configuration in production image without networking
        run: docker run --rm --network none -e BOT_TOKEN=12345:test -e CHAT_ID=-123 sili-bot --check-config
